server {
    listen 80;
    server_name _;

    # katalog z plikami frontendowymi
    root /usr/share/nginx/html;
    index index.html;

    # kolejne 'lokalizacja / adres { }' dziala jak if

    # proxy/przechwytywanie linkow /api/costamcostam na backend:8000
    # backend to bedzie nazwa name address kontenera z backendem
    location /api/ {
        proxy_pass http://backend:8000/; # czyli /api/listing -> /listing
        proxy_http_version 1.1; # wersja zgodna z fast api
        proxy_set_header Host $host; # przekazuje oryginalny host rzadania
        proxy_set_header X-Real-IP $remote_addr; # prawdziwy adres
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # przekazuje historie adresow ip przez proxy
        proxy_set_header X-Forwarded-Proto $scheme; # informuje czy https czy http
    }

    # Nginx jest jedynym punktem dostepu z internetu.
    # Ruch API przekazuje do backendu, a pozostaly ruch obsluguje frontend.
    location = /api {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # to leci na frtntend
    location / {
        try_files $uri $uri/ /index.html; # $uri aktualny adres rzadzania np /reset-password
    # Spróbuj znaleźć plik odpowiadający adresowi,
    # jeśli go nie ma, spróbuj znaleźć katalog,
    # a jeśli nadal go nie ma, zwróć index.html.
    }
}
