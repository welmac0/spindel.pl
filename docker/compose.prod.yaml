services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend

    env_file:
      - ../.env

    environment:
      DATABASE_PATH: /app/data/database.db
    
    # ports:
    #   - "8000:8000"
    
    volumes:
      - wymiana_data:/app/data 
    # wolumen Dockerowy wymiana_data -> /app/data wewnątrz kontenera backendu
    # wiec baza bedzie w /app/data/database.db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.75"
    mem_limit: 512m
    pids_limit: 128

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_MAINTENANCE: ${VITE_MAINTENANCE:-false}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    cpus: "0.50"
    mem_limit: 256m
    pids_limit: 128

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.2.2@sha256:5255405f241cd64b121f36ef0172711420816bbbd9c029674de53e5ed953182d
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.25"
    mem_limit: 256m
    pids_limit: 64
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
    restart: unless-stopped

volumes:
  wymiana_data:
    external: true
    name: docker_wymiana_data
  certbot_www: