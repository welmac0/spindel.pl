services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend

    env_file:
      - ../.env

    environment:
      DATABASE_PATH: /app/data/database.db
      SESSION_COOKIE_SECURE: "false"
    
    ports:
      - "8000:8000"
    
    volumes:
      - wymiana_data:/app/data 
    # wolumen Dockerowy wymiana_data -> /app/data wewnątrz kontenera backendu
    # wiec baza bedzie w /app/data/database.db

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend

    ports:
      - "5175:80"

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  wymiana_data:
    external: true
    name: docker_wymiana_data